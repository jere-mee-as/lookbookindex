<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Brands and their latest lookbooks, newest first.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%23111%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-family=%22Arial%22 font-weight=%22600%22 font-size=%2212%22 letter-spacing=%221%22 text-anchor=%22middle%22 fill=%22%23fff%22%3ELI%3C/text%3E%3C/svg%3E">
<title>Lookbook Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #FFFFFF; --ink: #111111; --muted: #555555; --faint: #B5B5B5; --hair: #E6E6E6; --tile: #F1F0EE;
  --font: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0B0B0B; --ink: #F2F2F2; --muted: #A3A3A3; --faint: #4D4D4D; --hair: #262626; --tile: #1A1A1A; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0B0B0B; --ink: #F2F2F2; --muted: #A3A3A3; --faint: #4D4D4D; --hair: #262626; --tile: #1A1A1A; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 12px; line-height: 1.45; letter-spacing: .02em; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 4px; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
.plain { all: unset; cursor: pointer; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
.up { text-transform: uppercase; }
.mu { color: var(--muted); }

/* header */
.head { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--hair);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
  padding: calc(env(safe-area-inset-top, 0px) + 22px) max(32px, env(safe-area-inset-right, 0px)) 22px max(32px, env(safe-area-inset-left, 0px)); }
.nav { display: flex; gap: 24px; white-space: nowrap; }
.nav a[aria-current="page"] { font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
.mark { font-size: 15px; font-weight: 600; letter-spacing: .24em; white-space: nowrap; margin: 0; }
.mark a:hover { text-decoration: none; }
.search { justify-self: end; display: flex; align-items: center; gap: 8px; }
.search input { border: 0; border-bottom: 1px solid var(--ink); background: transparent; width: 150px; padding: 4px 0; border-radius: 0; outline: none; }
.search input:focus-visible { border-bottom-width: 2px; padding-bottom: 3px; }

/* body */
.body { display: flex; flex-wrap: wrap; gap: 48px; padding: 32px max(32px, env(safe-area-inset-right, 0px)) 64px max(32px, env(safe-area-inset-left, 0px)); max-width: 1600px; margin: 0 auto; }
.side { flex: 1 1 160px; max-width: 200px; display: flex; flex-direction: column; gap: 11px; align-self: flex-start; position: sticky; top: 90px; }
.side button { all: unset; cursor: pointer; color: var(--muted); text-transform: uppercase; }
.side button:hover { color: var(--ink); }
.side button[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
.side button:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
.main { flex: 999 1 560px; min-width: 0; }
.lede { margin: 0 0 28px; color: var(--muted); }
.empty { color: var(--muted); padding: 24px 0; }

/* just in */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 44px 20px; }
.tile { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile:hover { text-decoration: none; }
.tile:hover .tb { text-decoration: underline; text-underline-offset: 4px; }
.pic { position: relative; aspect-ratio: 3 / 4; background: var(--tile); margin-bottom: 12px; overflow: hidden; display: grid; place-items: center; }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); transition: filter .45s ease; }
.tile:hover .pic img, .tile:focus-visible .pic img, .row:hover .pic img { filter: none; }
.pic.wide { background: #FFFFFF; box-shadow: inset 0 0 0 1px var(--hair); }
.pic.wide img { object-fit: contain; filter: none; }
.pic .ph { font-weight: 600; letter-spacing: .2em; text-transform: uppercase; text-align: center; padding: 16px; color: var(--muted); }
.tb { font-weight: 600; text-transform: uppercase; }

/* brands */
.bar2 { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px 32px; padding: 0 0 18px; border-bottom: 1px solid var(--hair); margin-bottom: 4px; }
.letters { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.sort { display: flex; gap: 14px; white-space: nowrap; }
.sort span { color: var(--muted); }
.sort button { all: unset; cursor: pointer; color: var(--muted); }
.sort button:hover { color: var(--ink); }
.sort button[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
.sort button:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
.grp.wide { flex-direction: column; gap: 0; }
.grp.wide h2 { width: auto; padding: 28px 0 6px; }
.letters a.off { color: var(--faint); pointer-events: none; }
.split { display: flex; gap: 40px; align-items: flex-start; }
.list { flex: 1 1 auto; min-width: 0; }
.grp { display: flex; gap: 24px; border-bottom: 1px solid var(--hair); scroll-margin-top: 96px; }
.grp h2 { margin: 0; padding: 14px 0; width: 28px; flex: none; font-size: 12px; font-weight: 600; }
.grp .rows { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row { all: unset; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, .7fr); gap: 16px; padding: 13px 0; }
.row:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
.row .n { font-weight: 600; text-transform: uppercase; }
.row[aria-expanded="true"] .n, .row:hover .n { text-decoration: underline; text-underline-offset: 4px; }
.row .s, .row .o { color: var(--muted); }
.card { flex: 0 0 340px; position: sticky; top: 90px; display: flex; flex-direction: column; gap: 6px; }
.card .pic { margin-bottom: 14px; }
.card .cn { font-weight: 600; text-transform: uppercase; font-size: 13px; }
.facts { margin: 10px 0 0; display: grid; grid-template-columns: 84px 1fr; gap: 6px 12px; }
.facts dt { color: var(--muted); text-transform: uppercase; }
.facts dd { margin: 0; }
.out { display: flex; flex-direction: column; margin-top: 14px; border-top: 1px solid var(--hair); }
.out a { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--hair); text-transform: uppercase; }
.inl { display: none; }

/* elsewhere */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 48px 32px; padding-top: 8px; }
.col { display: flex; flex-direction: column; gap: 26px; }
.col h2 { margin: 0; font-size: 12px; font-weight: 600; padding-bottom: 14px; border-bottom: 1px solid var(--ink); }
.site { display: flex; flex-direction: column; gap: 6px; }
.site .sn { font-size: 22px; font-weight: 500; letter-spacing: -.01em; }

.foot { padding: 0 max(32px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 28px) max(32px, env(safe-area-inset-left, 0px)); color: var(--muted); max-width: 1600px; margin: 0 auto; }

@media (max-width: 1100px) { .card { display: none; } .inl { display: block; padding: 2px 0 18px; } .inl .facts { margin-top: 4px; } }
@media (max-width: 760px) {
  .head { grid-template-columns: 1fr auto; padding-left: 16px; padding-right: 16px; gap: 14px 16px; }
  .mark { grid-column: 1 / -1; grid-row: 1; text-align: center; }
  .nav { gap: 16px; }
  .sl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .search input { width: 96px; }
  .search input::placeholder { color: var(--ink); opacity: 1; }
  .body { padding: 18px 16px 48px; gap: 18px; }
  .side { position: static; max-width: none; flex: 1 1 100%; flex-direction: row; gap: 18px; overflow-x: auto; white-space: nowrap; padding-bottom: 4px; scrollbar-width: none; }
  .side::-webkit-scrollbar { display: none; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 14px; }
  .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
  .row .o { display: none; }
  .grp { gap: 14px; }
  .foot { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: reduce) { .pic img { transition: none; } }
</style>
</head>
<body>

<header class="head">
  <nav class="nav" aria-label="Sections">
    <a href="#just" data-v="just">JUST IN</a>
    <a href="#brands" data-v="brands">BRANDS</a>
    <a href="#elsewhere" data-v="elsewhere">ELSEWHERE</a>
  </nav>
  <p class="mark"><a href="#just">LOOKBOOK INDEX</a></p>
  <label class="search"><span class="sl">SEARCH</span><input id="q" type="search" placeholder="" autocomplete="off" spellcheck="false" aria-label="Search brands"></label>
</header>

<div class="body">
  <aside class="side" id="side" aria-label="Category"></aside>
  <main class="main">
    <section id="v-just">
      <p class="lede">Brands and their latest lookbooks, newest first.</p>
      <div class="grid" id="grid"></div>
    </section>
    <section id="v-brands" hidden>
      <div class="bar2">
        <nav class="letters" id="letters" aria-label="Jump to"></nav>
        <div class="sort" role="group" aria-label="Sort"><span>SORT</span><button type="button" data-s="az">A–Z</button><button type="button" data-s="region">REGION</button><button type="button" data-s="price">PRICE</button></div>
      </div>
      <div class="split">
        <div class="list" id="list"></div>
        <aside class="card" id="card" aria-live="polite"></aside>
      </div>
    </section>
    <section id="v-elsewhere" hidden>
      <div class="cols" id="cols"></div>
    </section>
  </main>
</div>
<footer class="foot">Made by Jere</footer>

<script>
(function () {
  const CATS = ["Luxury house","Designer","Tailoring","Contemporary","Streetwear","Heritage & workwear","Outdoor & technical","Denim","Minimal","Avant-garde","Knitwear","High street & basics"];
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const TIER = ["", "High street", "Premium", "Designer", "Luxury"];
  const REGION = { "France":"Europe","Italy":"Europe","United Kingdom":"Europe","Spain":"Europe","Germany":"Europe","Belgium":"Europe","Netherlands":"Europe","Sweden":"Europe","Denmark":"Europe","Norway":"Europe","Switzerland":"Europe","Japan":"Asia","South Korea":"Asia","China":"Asia","Hong Kong":"Asia","India":"Asia","United States":"North America","Canada":"North America","Mexico":"Latin America","Brazil":"Latin America","Argentina":"Latin America","Colombia":"Latin America","Nigeria":"Africa","South Africa":"Africa","Australia":"Oceania" };
  const REGIONS = ["Europe", "North America", "Asia", "Latin America", "Africa", "Oceania"];
  const ELSEWHERE = [
    ["Runway", [["Vogue Runway","Every show, every season","https://www.vogue.com/fashion-shows"],["Tagwalk","Search runways by item","https://www.tag-walk.com/en/"],["NOWFASHION","Live show coverage","https://nowfashion.com/"]]],
    ["Shop", [["SSENSE","Designer menswear","https://www.ssense.com/en-us/men"],["Mr Porter","Luxury menswear","https://www.mrporter.com/en-us/"]]],
    ["Read", [["SSENSE Editorial","Essays and interviews","https://www.ssense.com/en-us/editorial"],["Fantastic Man","Men’s magazine","https://www.fantasticman.com/"],["Permanent Style","Tailoring and craft","https://www.permanentstyle.com/"],["The Rake","Classic elegance","https://therake.com/us/"],["Highsnobiety","Streetwear and drops","https://www.highsnobiety.com/"],["Dazed","Fashion and culture","https://www.dazeddigital.com/"]]],
    ["Industry", [["Pitti Immagine","Florence menswear fair","https://www.pittimmagine.com/"],["Models.com","Models and credits","https://models.com/"]]]
  ];

  const $ = (s) => document.querySelector(s);
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
  const key = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "");
  const httpsUrl = (u) => (typeof u === "string" && /^https:\/\//i.test(u)) ? u : null;
  const ext = (href, txt) => { const a = el("a", null, txt); a.href = href; a.target = "_blank"; a.rel = "noopener"; return a; };
  const okCover = (c) => typeof c === "string" && /^covers\/(brands\/)?[\w.-]+\.(jpe?g|png|webp|gif)$/i.test(c);
  const pd = (d) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ""); return m ? { y: +m[1], m: +m[2] - 1, d: +m[3] } : null; };
  const t = (x) => { const p = pd(x.date); return p ? Date.UTC(p.y, p.m, p.d) : 0; };
  const when = (x) => { const p = pd(x.date); if (!p) return ""; return x.approx ? MON[p.m] + " " + p.y : p.d + " " + MON[p.m]; };
  const letterOf = (n) => { const k = n.normalize("NFD").replace(/[̀-ͯ]/g, "")[0].toUpperCase(); return /[A-Z]/.test(k) ? k : "#"; };

  let brands = [], drops = [], byKey = new Map(), latest = new Map();
  let saved = null; try { saved = localStorage.getItem("lbi-sort"); } catch (e) {}
  const st = { view: "just", cat: "", q: "", sel: null, sort: ["az", "region", "price"].includes(saved) ? saved : "az" };

  function pic(cover, name, ia) {
    const d = el("div", ia > 1.25 ? "pic wide" : "pic");
    if (okCover(cover)) { const i = el("img"); i.src = cover; i.alt = ""; i.loading = "lazy"; i.onerror = () => { i.remove(); d.append(el("span", "ph", name)); }; d.append(i); }
    else { d.setAttribute("aria-hidden", "true"); d.append(el("span", "ph", name)); }
    return d;
  }

  // ---------- routing ----------
  function route() {
    const h = location.hash.slice(1);
    st.view = h === "brands" || h === "index" ? "brands" : h === "elsewhere" ? "elsewhere" : "just";
    for (const v of ["just", "brands", "elsewhere"]) $("#v-" + v).hidden = v !== st.view;
    document.querySelectorAll(".nav a").forEach((a) => a.dataset.v === st.view ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    $("#side").hidden = st.view === "elsewhere";
  }
  addEventListener("hashchange", () => { route(); scrollTo(0, 0); });

  // ---------- sidebar ----------
  function renderSide() {
    const s = $("#side"); s.replaceChildren();
    for (const c of [""].concat(CATS)) {
      const b = el("button", null, c || "All"); b.type = "button"; b.setAttribute("aria-pressed", String(st.cat === c));
      b.onclick = () => { st.cat = c; renderSide(); renderJust(); renderBrands(); };
      s.append(b);
    }
  }

  // ---------- just in ----------
  function renderJust() {
    const g = $("#grid"); g.replaceChildren();
    const list = drops.slice().sort((a, b) => t(b) - t(a))
      .filter((x) => !st.cat || (byKey.get(key(x.brand)) || {}).cat === st.cat);
    if (!list.length) { g.append(el("p", "empty", drops.length ? "Nothing new in this category yet." : "The feed didn't load. Reload to try again.")); return; }
    for (const x of list) {
      const b = byKey.get(key(x.brand)) || {};
      const u = httpsUrl(x.url);
      const a = el(u ? "a" : "div", "tile");
      if (u) { a.href = u; a.target = "_blank"; a.rel = "noopener"; }
      const nm = x.kind === "Collab" && /×/.test(x.title || "") ? x.title.split(":")[0].trim() : x.brand;
      a.append(x.cover ? pic(x.cover, nm, x.ia) : pic(b.img, nm, b.ia), el("span", "tb", nm));
      if (b.s) a.append(el("span", "mu", b.s));
      a.append(el("span", "mu", [x.season, when(x)].filter(Boolean).join(" · ")));
      g.append(a);
    }
  }

  // ---------- brands ----------
  function shown() {
    const words = st.q.toLowerCase().split(/\s+/).map(key).filter(Boolean);
    return brands.filter((b) => {
      if (st.cat && b.cat !== st.cat) return false;
      if (words.length) { const h = key([b.n, b.s, b.c, b.ci, b.cat, (b.t || []).join(" ")].join(" ")); if (!words.every((w) => h.includes(w))) return false; }
      return true;
    });
  }
  function details(b, wrap) {
    const lt = latest.get(key(b.n));
    const dl = el("dl", "facts");
    const add = (k, v) => { if (v) dl.append(el("dt", null, k), el("dd", null, v)); };
    add("From", [b.ci, b.c].filter(Boolean).join(", ")); add("Est.", b.y ? String(b.y) : ""); add("Category", b.cat); add("Price", TIER[b.p] || "");
    if (lt) add("Latest", [lt.season, when(lt)].filter(Boolean).join(" · "));
    wrap.append(dl);
    const o = el("div", "out");
    const L = (href, txt) => { const a = ext(href, txt); a.append(el("span", null, "↗")); o.append(a); };
    if (lt && httpsUrl(lt.url)) L(lt.url, "Latest collection");
    L("https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(b.n + " lookbook"), "Lookbooks");
    L("https://www.google.com/search?q=" + encodeURIComponent(b.n + " site:vogue.com/fashion-shows"), "Runway");
    if (b.u) L("https://" + b.u, b.u);
    wrap.append(o);
  }
  function renderCard() {
    const c = $("#card"); c.replaceChildren();
    const b = st.sel && brands.find((x) => x.n === st.sel);
    if (!b) return;
    const lt = latest.get(key(b.n));
    c.append(lt && lt.cover ? pic(lt.cover, b.n, lt.ia) : pic(b.img, b.n, b.ia), el("span", "cn", b.n), el("span", "mu", b.s || ""));
    details(b, c);
  }
  function select(n, rerender) {
    if (st.sel === n && !rerender) return;
    st.sel = n; renderCard();
    document.querySelectorAll(".row").forEach((r) => r.setAttribute("aria-expanded", String(r.dataset.n === n)));
    document.querySelectorAll(".inl").forEach((i) => i.remove());
    const r = [...document.querySelectorAll(".row")].find((x) => x.dataset.n === n);
    if (r) { const b = brands.find((x) => x.n === n); const box = el("div", "inl"); details(b, box); r.after(box); }
  }
  function renderBrands() {
    const L = $("#list"); L.replaceChildren();
    const r = shown().sort((a, b) => a.n.localeCompare(b.n));
    const az = st.sort === "az";
    const groupOf = st.sort === "region" ? (b) => REGION[b.c] || "Elsewhere" : st.sort === "price" ? (b) => TIER[b.p] || "Unpriced" : (b) => letterOf(b.n);
    const order = st.sort === "region" ? REGIONS : st.sort === "price" ? [4, 3, 2, 1].map((p) => TIER[p]) : ["#"].concat("ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""));
    const groups = new Map(order.map((k) => [k, []]));
    r.forEach((b) => { const k = groupOf(b); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(b); });
    const ids = new Map([...groups.keys()].map((k, i) => [k, "G-" + i]));
    const label = (k) => az ? k : k.toUpperCase();
    const lt = $("#letters"); lt.replaceChildren();
    for (const [k, list] of groups) {
      if (!az && !list.length) continue;
      const a = el("a", list.length ? null : "off", label(k)); a.href = "#brands";
      if (list.length) a.onclick = (e) => { e.preventDefault(); document.getElementById(ids.get(k)).scrollIntoView({ block: "start" }); };
      else { a.setAttribute("aria-disabled", "true"); a.tabIndex = -1; }
      lt.append(a);
    }
    document.querySelectorAll(".sort button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.s === st.sort)));
    if (!r.length) { L.append(el("p", "empty", "No brands match.")); $("#card").replaceChildren(); return; }
    for (const [k, list] of groups) {
      if (!list.length) continue;
      const sec = el("section", az ? "grp" : "grp wide"); sec.id = ids.get(k);
      sec.append(el("h2", null, label(k)));
      const rows = el("div", "rows");
      for (const b of list) {
        const row = el("button", "row"); row.type = "button"; row.dataset.n = b.n; row.setAttribute("aria-expanded", "false");
        row.append(el("span", "n", b.n), el("span", "s", b.s || ""), el("span", "o", b.c));
        row.onclick = () => { if (st.sel === b.n && !matchMedia("(min-width: 1101px)").matches) { st.sel = null; select(null, true); } else select(b.n, true); };
        rows.append(row);
      }
      sec.append(rows); L.append(sec);
    }
    if (!st.sel || !r.some((b) => b.n === st.sel)) st.sel = matchMedia("(min-width: 1101px)").matches ? r[0].n : null;
    select(st.sel, true);
  }

  document.querySelectorAll(".sort button").forEach((b) => { b.onclick = () => {
    st.sort = b.dataset.s; try { localStorage.setItem("lbi-sort", st.sort); } catch (e) {}
    renderBrands(); $("#v-brands").scrollIntoView({ block: "start" }); scrollTo(0, 0);
  }; });

  // ---------- elsewhere ----------
  function renderElsewhere() {
    const C = $("#cols");
    for (const [h, items] of ELSEWHERE) {
      const col = el("section", "col"); col.append(el("h2", "up", h));
      for (const [n, w, u] of items) { const a = ext(u, null); a.className = "site"; a.append(el("span", "sn", n + " ↗"), el("span", "mu", w)); col.append(a); }
      C.append(col);
    }
  }

  // ---------- search ----------
  let tm;
  $("#q").addEventListener("input", (e) => {
    clearTimeout(tm);
    tm = setTimeout(() => { st.q = e.target.value; if (st.view !== "brands") location.hash = "brands"; renderBrands(); }, 90);
  });

  // ---------- boot ----------
  if (matchMedia("(max-width: 760px)").matches) $("#q").placeholder = "SEARCH";
  route(); renderSide(); renderElsewhere();
  const getJSON = (u) => fetch(u, { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
  Promise.all([getJSON("brands.json"), getJSON("drops.json").catch(() => [])]).then(([b, d]) => {
    brands = b; byKey = new Map(b.map((x) => [key(x.n), x]));
    drops = Array.isArray(d) ? d.filter((x) => x && x.brand && x.date) : [];
    latest = new Map(); for (const x of drops) { const k = key(x.brand), c = latest.get(k); if (!c || t(x) > t(c)) latest.set(k, x); }
    renderJust(); renderBrands();
  }).catch(() => { $("#grid").append(el("p", "empty", "The site didn't load. Reload to try again.")); });
})();
</script>
</body>
</html>
