name: Fetch images

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * 1"   # Mondays, after the Sunday drops refresh
  push:
    branches: [main]
    paths: ["drops.json", "brands.json"]

permissions:
  contents: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp@0.33.5
      - run: node scripts/fetch-images.mjs
      - name: Commit new images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add covers drops.json brands.json
          git diff --cached --quiet && exit 0
          git commit -m "Fetch lookbook and brand images"
          git pull --rebase
          git push
